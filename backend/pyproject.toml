[project]
name = "play-tanks-server"
version = "0.1.0"

description = "Backend server for the Play Tanks game."
readme = "README.md" 
requires-python = ">=3.8"
license = {file = "LICENSE"}

maintainers = [
  {name = "Kevin Langbroek", email = "kevinlangbroek1@gmail.com" } 
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv"
]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.uvicorn]
reload = true